<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raktár Pro – Termék részletek</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/common.css">
  <link rel="stylesheet" href="./assets/css/nav-unify.css">
</head>

<body>
  <nav class="rp-nav py-3">
    <div class="container d-flex align-items-center justify-content-between gap-3">
      <a class="rp-brand" href="./products.html">
        <div class="rp-logo"><img src="./assets/img/logo.png" alt="Raktár Pro logo" class="rp-logo-img"></div>
        <div>
          <div class="fw-bold">Raktár Pro</div>
          <div class="rp-subtitle" data-i18n="nav_subtitle">Professzionális raktári megoldások</div>
        </div>
      </a>

      <div class="d-flex align-items-center gap-2">
        <button id="themeToggle" class="btn rp-pill-btn" type="button" data-i18n-title="theme_title_dark" title="Sötét mód">
          <i class="bi bi-moon-stars rp-icon" aria-hidden="true"></i>
        </button>

        <a class="btn rp-pill-btn position-relative" href="./cart.html" title="Kosár">
          <i class="bi bi-cart3 rp-icon" aria-hidden="true"></i>
          <span id="cartBadge" class="rp-badge" style="display:none;">0</span>
        </a>

        <div class="dropdown"> 
          <button class="btn rp-pill-btn d-flex align-items-center gap-2 dropdown-toggle"
                  data-bs-toggle="dropdown" aria-expanded="false">
            <span class="rp-avatar">A</span>
            <span class="d-none d-md-inline" data-i18n="nav_account">Fiók</span>
          </button>

          <ul class="dropdown-menu dropdown-menu-end">

            <li id="adminMenuItem" style="display:none;">
              <a class="dropdown-item" href="./admin.html"><i class="bi bi-speedometer2 me-2"></i><span data-i18n="nav_admin">Admin</span></a>
            </li>
            <li id="adminMenuDivider" style="display:none;"><hr class="dropdown-divider"></li>

            <li><a class="dropdown-item" href="./account.html"><i class="bi bi-gear me-2"></i><span data-i18n="nav_account_settings">Fiókbeállítások</span></a></li>
            <li><a class="dropdown-item" href="./orders.html"><i class="bi bi-receipt me-2"></i><span data-i18n="nav_orders">Rendeléseim</span></a></li>
            <li><a class="dropdown-item" href="./cart.html"><i class="bi bi-cart3 me-2"></i><span data-i18n="nav_cart">Kosár</span></a></li>

            <li><hr class="dropdown-divider"></li>

            <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i><span data-i18n="nav_logout">Kijelentkezés</span></a></li>
          </ul>

        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <a class="btn rp-pill-btn rp-action-btn" href="./products.html">
        <i class="bi bi-arrow-left rp-icon" aria-hidden="true"></i>
        <span>Vissza</span>
      </a>
    </div>

    <div id="pdError" class="rp-empty" style="display:none;"></div>

    <div id="pdWrap" class="row g-4" style="display:none;">
      <div class="col-12 col-lg-6">
        <div id="pdCarouselWrap"></div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <div class="rp-tag" id="pdCategory">Kategória</div>
          <div class="rp-stock-pill" id="pdStock">In stock</div>
        </div>

        <h1 class="fw-bold mb-2" id="pdTitle">Termék</h1>
        <div class="rp-price fs-3 mb-2" id="pdPrice">0 Ft</div>

        <div id="pdAdminMeta" class="small opacity-75 mb-3">
          <div><b>SKU:</b> <span id="pdSku">-</span></div>
          <div><b>ID:</b> <span id="pdId">-</span></div>
          <div><b>Készlet:</b> <span id="pdStockExact">-</span></div>
        </div>

        <div class="rp-desc" id="pdDesc" style="white-space:pre-wrap;"></div>

        <div class="d-flex gap-2 mt-4">
          <button id="pdAddBtn" class="btn rp-pill-btn rp-action-btn rp-action-primary flex-grow-1" type="button">
            <i class="bi bi-cart-plus rp-icon" aria-hidden="true"></i>
            <span>Kosárba</span>
          </button>
          <a class="btn rp-pill-btn rp-action-btn flex-grow-1" href="./cart.html">
            <i class="bi bi-bag-check rp-icon" aria-hidden="true"></i>
            <span>Ugrás a kosárra</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/lang.js"></script>
  <script src="./assets/js/nav.js"></script>
  <script src="./assets/js/product_details.js"></script>
</body>
</html>
