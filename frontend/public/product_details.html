<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Raktár Pro – Termék részletek</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./assets/css/common.css">
  <link rel="stylesheet" href="./assets/css/nav-unify.css">
  <link rel="stylesheet" href="./assets/css/products.css">
  <style>
    .rp-carousel { border-radius: 22px; overflow: hidden; border: 1px solid var(--glass-border); background: var(--card); backdrop-filter: blur(14px); }
    .rp-carousel-img-wrap { width: 100%; height: 400px; display: grid; place-items: center; background: var(--card); overflow: hidden; }
    .rp-carousel-img-wrap img { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; display: block; }
    .rp-carousel-thumbs { overflow-x: auto; padding-bottom: 4px; }
    .rp-thumb { width: 72px; height: 54px; border-radius: 10px; border: 2px solid var(--glass-border); background: var(--card); padding: 2px; cursor: pointer; overflow: hidden; transition: border-color 150ms ease; flex-shrink: 0; }
    .rp-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .rp-thumb.active, .rp-thumb:hover { border-color: var(--accent); }
    .rp-desc { color: var(--muted-2); line-height: 1.7; }
    .rp-product-meta { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 14px; padding: 12px 16px; }
    @media(max-width:576px){ .rp-carousel-img-wrap { height: 260px; } }
  </style>
</head>
<body>
<nav class="rp-nav py-3">
  <div class="container d-flex align-items-center justify-content-between gap-3">
    <a class="rp-brand" href="./products.html">
      <div class="rp-logo"><img src="./assets/img/logo.png" alt="Raktár Pro logo" class="rp-logo-img"></div>
      <div>
        <div class="fw-bold">Raktár Pro</div>
        <div class="rp-subtitle" data-i18n="nav_subtitle">Professzionális raktári megoldások</div>
      </div>
    </a>
    <div class="d-flex align-items-center gap-2">
      <div class="rp-lang-flags">
        <button class="rp-lang-btn" type="button" data-lang="hu" title="Magyar">🇭🇺</button>
        <button class="rp-lang-btn" type="button" data-lang="en" title="English">🇬🇧</button>
        <button class="rp-lang-btn" type="button" data-lang="de" title="Deutsch">🇩🇪</button>
      </div>
      <button id="themeToggle" class="btn rp-pill-btn" type="button" title="Sötét mód">
        <i class="bi bi-moon-stars rp-icon"></i>
      </button>
      <a class="btn rp-pill-btn position-relative" href="./cart.html" title="Kosár">
        <i class="bi bi-cart3 rp-icon"></i>
        <span id="cartBadge" class="rp-badge" style="display:none;">0</span>
      </a>
      <div class="dropdown">
        <button class="btn rp-pill-btn d-flex align-items-center gap-2 dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
          <span class="rp-avatar">A</span>
          <span class="d-none d-md-inline" data-i18n="nav_account">Fiók</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li id="adminMenuItem" style="display:none;"><a class="dropdown-item" href="./admin.html"><i class="bi bi-speedometer2 me-2"></i><span data-i18n="nav_admin">Admin</span></a></li>
          <li id="adminMenuDivider" style="display:none;"><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="./account.html"><i class="bi bi-gear me-2"></i><span data-i18n="nav_account_settings">Fiókbeállítások</span></a></li>
          <li><a class="dropdown-item" href="./orders.html"><i class="bi bi-receipt me-2"></i><span data-i18n="nav_orders">Rendeléseim</span></a></li>
          <li><a class="dropdown-item" href="./cart.html"><i class="bi bi-cart3 me-2"></i><span data-i18n="nav_cart">Kosár</span></a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i><span data-i18n="nav_logout">Kijelentkezés</span></a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="mb-3">
    <a class="btn rp-pill-btn rp-action-btn" href="./products.html">
      <i class="bi bi-arrow-left rp-icon"></i>
      <span data-i18n="back_to_products">Vissza a termékekhez</span>
    </a>
  </div>

  <div id="pdError" style="display:none;" class="alert" style="border-radius:16px;"></div>

  <div id="pdWrap" class="row g-4" style="display:none;">
    <!-- Images -->
    <div class="col-12 col-lg-6">
      <div id="pdCarouselWrap"></div>
    </div>

    <!-- Info -->
    <div class="col-12 col-lg-6 d-flex flex-column gap-3">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <span class="rp-tag" id="pdCategory">Kategória</span>
        <div id="pdStock"></div>
      </div>

      <div>
        <h1 class="fw-bold mb-1 fs-3" id="pdTitle">Termék</h1>
        <div class="rp-price fs-2 fw-black" id="pdPrice">0 Ft</div>
      </div>

      <div id="pdAdminMeta" class="rp-product-meta small">
        <div class="d-flex gap-3 flex-wrap">
          <div><span class="opacity-60">SKU:</span> <strong id="pdSku">-</strong></div>
          <div><span class="opacity-60">ID:</span> <strong id="pdId">-</strong></div>
          <div><span class="opacity-60" data-i18n="admin_th_stock">Készlet:</span> <strong id="pdStockExact">-</strong></div>
        </div>
      </div>

      <div class="rp-desc" id="pdDesc" style="white-space:pre-wrap;"></div>

      <div class="d-flex gap-2 mt-2">
        <button id="pdAddBtn" class="btn rp-pill-btn rp-action-btn rp-action-primary flex-grow-1" type="button">
          <i class="bi bi-cart-plus rp-icon"></i>
          <span data-i18n="add_to_cart">Kosárba</span>
        </button>
        <a class="btn rp-pill-btn rp-action-btn flex-grow-1" href="./cart.html">
          <i class="bi bi-bag-check rp-icon"></i>
          <span data-i18n="nav_cart">Kosár</span>
        </a>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/api.js"></script>
<script src="./assets/js/lang.js"></script>
<script src="./assets/js/nav.js"></script>
<script src="./assets/js/product_details.js"></script>
</body>
</html>
