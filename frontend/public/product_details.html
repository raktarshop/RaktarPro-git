<main class="container py-4">
  <div class="mb-3 rp-anim-up">

            <div><span class="opacity-60">ID:</span> <strong id="pdId">—</strong></div>

        <!-- TABS: Leírás / Műszaki adatok -->
        <div class="rp-tab-group mb-3">
          <button class="rp-tab-pill active" data-tab="desc">Leírás</button>
          <button class="rp-tab-pill" data-tab="specs">Műszaki adatok</button>
        </div>

        <div class="rp-tab-panel-content active" data-tab="desc">

        </div>
        <div class="rp-tab-panel-content" data-tab="specs">
          <div class="rp-specs" id="pdSpecs"></div>
        </div>

        <div class="rp-divider my-3"></div>
        <!-- Actions -->
        <div class="d-flex gap-2">

          <button id="pdWishBtn" class="btn rp-pill-btn rp-action-btn" title="Kedvencekhez">
            <i class="bi bi-heart rp-icon"></i>
          </button>
        </div>
      </div>
    </div>

</main>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="./assets/js/rp-toast.js?v=27"></script>
<script defer src="./assets/js/api.js?v=27"></script>
<script defer src="./assets/js/nav.js?v=27"></script>
<script defer src="./assets/js/product_details_new.js?v=27"></script>

<script>
// ── DARK MODE FORCE ──
(function(){
  // Mindig dark mode az alapértelmezett
  if (!localStorage.getItem('rp_theme')) {
    localStorage.setItem('rp_theme', 'dark');
  }
  document.documentElement.setAttribute('data-theme', localStorage.getItem('rp_theme'));
})();

// ── OLDALVÁLTÁS ANIMÁCIÓ + BFCACHE FIX ──
// bfcache fix: visszagomb esetén az oldal látható legyen
window.addEventListener('pageshow', function(e) {
  document.body.classList.remove('rp-page-out');
  document.body.style.opacity = '1';
  document.body.style.animation = 'none';
  // force reflow then re-enable animation
  void document.body.offsetHeight;
  document.body.style.animation = '';
});

document.addEventListener('click', function(e) {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const href = a.getAttribute('href');
  if (!href || href.startsWith('#') || href.startsWith('mailto') || href.startsWith('tel')) return;
  if (a.target === '_blank' || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (href.startsWith('http') && !href.includes('localhost')) return;
  e.preventDefault();
  document.body.classList.add('rp-page-out');
  setTimeout(() => { window.location.href = href; }, 80);
});
</script>
</body>
</html>
