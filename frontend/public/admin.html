<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Raktár Pro – Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./assets/css/common.css?v=26">
  <script>!function(){var t=localStorage.getItem("rp_theme")||"dark";document.documentElement.setAttribute("data-theme",t)}();</script>
  <link rel="stylesheet" href="./assets/css/nav-unify.css?v=26">
  <link rel="stylesheet" href="./assets/css/admin.css?v=26">
  <link rel="stylesheet" href="./assets/css/rp-luxury.css?v=26">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;}
    body{font-family:var(--font-body,'DM Sans',sans-serif);}

    /* ── CATEGORY MANAGER ── */
    .cat-manager {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .cat-manager-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cat-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      min-height: 36px;
    }
    .cat-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px 5px 12px;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      transition: all 140ms;
    }
    .cat-chip:hover { border-color: rgba(59,92,255,.35); }
    .cat-chip-del {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: none;
      background: rgba(239,68,68,.15);
      color: #ef4444;
      cursor: pointer;
      display: grid; place-items: center;
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      transition: background 130ms;
      padding: 0;
    }
    .cat-chip-del:hover { background: rgba(239,68,68,.3); }
    .cat-add-row {
      display: flex;
      gap: 8px;
    }
    .cat-add-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 13px;
      outline: none;
    }
    .cat-add-input:focus {
      border-color: rgba(59,92,255,.45);
      box-shadow: 0 0 0 3px rgba(59,92,255,.12);
    }
    .cat-add-btn {
      padding: 8px 16px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b5cff, #0bc5ff);
      color: #fff;
      border: none;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 150ms;
    }
    .cat-add-btn:hover { opacity: .9; transform: translateY(-1px); }
    .cat-add-btn:disabled { opacity: .5; pointer-events: none; }
    .cat-msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>

<nav class="rp-nav py-3">
  <div class="container d-flex align-items-center justify-content-between gap-3">
    <a class="rp-brand" href="./home.html">
      <div class="rp-logo"><img src="./assets/img/logo.png" alt="Raktár Pro logo" class="rp-logo-img"></div>
      <div>
        <div class="fw-bold">Raktár Pro</div>
        <div class="rp-subtitle">Admin Panel</div>
      </div>
    </a>
    <div class="d-flex align-items-center gap-2">
      <button id="themeToggle" class="btn rp-pill-btn" type="button"><i class="bi bi-moon-stars rp-icon"></i></button>
      <a class="btn rp-pill-btn position-relative" href="./cart.html">
        <i class="bi bi-cart3 rp-icon"></i>
        <span id="cartBadge" class="rp-badge" style="display:none;">0</span>
      </a>
      <div class="dropdown">
        <button class="btn rp-pill-btn d-flex align-items-center gap-2 dropdown-toggle" data-bs-toggle="dropdown">
          <span class="rp-avatar" id="navAvatar">A</span>
          <span class="d-none d-md-inline">Fiók</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li id="adminMenuItem" style="display:none;"><a class="dropdown-item" href="./admin.html"><i class="bi bi-speedometer2 me-2"></i>Admin</a></li>
          <li id="adminMenuDivider" style="display:none;"><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="./account.html"><i class="bi bi-gear me-2"></i>Fiókbeállítások</a></li>
          <li><a class="dropdown-item" href="./orders.html"><i class="bi bi-receipt me-2"></i>Rendeléseim</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Kijelentkezés</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-2 mb-3">
    <div>
      <h1 class="rp-admin-title rp-reveal">Admin – Dashboard</h1>
      <div id="adminNamePill" class="mt-1"></div>
    </div>
  </div>

  <!-- Admin nav tabs -->
  <div class="d-flex flex-wrap gap-2 mb-4">
    <a class="btn rp-admin-btn active" href="./admin.html"><i class="bi bi-grid-1x2-fill me-2"></i>Dashboard</a>
    <a class="btn rp-admin-btn d-flex align-items-center gap-2" href="./admin_orders.html">
      <i class="bi bi-box-seam"></i>Rendelések
      <span class="rp-notif-bubble" data-admin-badge="orders" style="display:none;">0</span>
    </a>
    <a class="btn rp-admin-btn d-flex align-items-center gap-2" href="./admin_support.html">
      <i class="bi bi-life-preserver"></i>Support
      <span class="rp-notif-bubble" data-admin-badge="support" style="display:none;">0</span>
    </a>
    <a class="btn rp-admin-btn" href="./admin_finance.html"><i class="bi bi-graph-up-arrow me-2"></i>Pénzügyek</a>
    <a class="btn rp-admin-btn" href="./products.html"><i class="bi bi-arrow-left-circle me-2"></i>Vissza a bolthoz</a>
  </div>

  <!-- Search & Add bar -->
  <div class="rp-admin-card rp-reveal p-3 mb-3">
    <div class="d-flex flex-column flex-md-row gap-2 align-items-md-center justify-content-between">
      <input id="adminSearch" class="form-control rp-admin-input" placeholder="Keresés (név, SKU)…"/>
      <div class="d-flex gap-2">
        <button id="adminAddProduct" class="btn rp-admin-btn">
          <i class="bi bi-plus-circle me-2"></i>+ Új termék
        </button>
        <button id="adminReload" class="btn rp-admin-btn">Újratöltés</button>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div id="adminTableWrap" class="rp-admin-card rp-reveal p-3">
    <div class="table-responsive">
      <table class="table table-sm align-middle mb-0 rp-admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Név</th>
            <th>Kategória</th>
            <th>Ár (Ft)</th>
            <th>Készlet</th>
            <th>Művelet</th>
          </tr>
        </thead>
        <tbody id="adminTbody"></tbody>
      </table>
    </div>
    <div id="adminMsg" class="mt-2 small" style="opacity:.85;"></div>
  </div>
</main>

<!-- New / Edit product modal -->
<div class="modal fade" id="newProductModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Új termék</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="newPId">
        <div class="mb-2">
          <label class="form-label small fw-bold">Név *</label>
          <input id="newPName" class="form-control" type="text" placeholder="Termék neve">
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">SKU *</label>
          <input id="newPSku" class="form-control" type="text" placeholder="pl. P042">
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label small fw-bold">Ár (Ft) *</label>
            <input id="newPPrice" class="form-control" type="number" min="0" step="1" placeholder="0">
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold">Készlet *</label>
            <input id="newPStock" class="form-control" type="number" min="0" step="1" placeholder="0">
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">Kategória *</label>
          <select id="newPCategory" class="form-select"></select>
        </div>
        <div id="newPMsg" class="mt-2 small" style="opacity:.9;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn rp-admin-btn" data-bs-dismiss="modal">Mégse</button>
        <button type="button" id="newPSave" class="btn rp-admin-btn"><i class="bi bi-check2 me-2"></i>Mentés</button>
      </div>
    </div>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="./assets/js/rp-toast.js?v=26"></script>
<script defer src="./assets/js/api.js?v=26"></script>
<script defer src="./assets/js/nav.js?v=26"></script>
<script defer src="./assets/js/animate.js?v=26"></script>
<script defer src="./assets/js/admin.js?v=26"></script>
</body>
</html>
