<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Raktár Pro – Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./assets/css/common.css">
  <link rel="stylesheet" href="./assets/css/nav-unify.css">
  <link rel="stylesheet" href="./assets/css/admin.css">
</head>
<body>

<nav class="rp-nav py-3">
  <div class="container d-flex align-items-center justify-content-between gap-3">
    <a class="rp-brand" href="./products.html">
      <div class="rp-logo"><img src="./assets/img/logo.png" alt="Raktár Pro logo" class="rp-logo-img"></div>
      <div>
        <div class="fw-bold">Raktár Pro</div>
        <div class="rp-subtitle" data-i18n="nav_subtitle">Professzionális raktári megoldások</div>
      </div>
    </a>
    <div class="d-flex align-items-center gap-2">
      
      <button id="themeToggle" class="btn rp-pill-btn" type="button" title="Sötét mód">
        <i class="bi bi-moon-stars rp-icon"></i>
      </button>
      <a class="btn rp-pill-btn position-relative" href="./cart.html" title="Kosár">
        <i class="bi bi-cart3 rp-icon"></i>
        <span id="cartBadge" class="rp-badge" style="display:none;">0</span>
      </a>
      <div class="dropdown">
        <button class="btn rp-pill-btn d-flex align-items-center gap-2 dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
          <span class="rp-avatar">A</span>
          <span class="d-none d-md-inline" data-i18n="nav_account">Fiók</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li id="adminMenuItem" style="display:none;"><a class="dropdown-item" href="./admin.html"><i class="bi bi-speedometer2 me-2"></i><span data-i18n="nav_admin">Admin</span></a></li>
          <li id="adminMenuDivider" style="display:none;"><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="./account.html"><i class="bi bi-gear me-2"></i><span data-i18n="nav_account_settings">Fiókbeállítások</span></a></li>
          <li><a class="dropdown-item" href="./orders.html"><i class="bi bi-receipt me-2"></i><span data-i18n="nav_orders">Rendeléseim</span></a></li>
          <li><a class="dropdown-item" href="./cart.html"><i class="bi bi-cart3 me-2"></i><span data-i18n="nav_cart">Kosár</span></a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i><span data-i18n="nav_logout">Kijelentkezés</span></a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">
  <!-- Header -->
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-2 mb-3">
    <div>
      <h1 class="rp-admin-title rp-reveal" data-i18n="admin_title">Admin – Készlet / Ár frissítés</h1>
      <div id="adminNamePill" class="mt-1"></div>
    </div>
  </div>

  <!-- Admin nav tabs -->
  <div class="d-flex flex-wrap gap-2 mb-4">
    <a class="btn rp-admin-btn active" href="./admin.html">
      <i class="bi bi-grid-1x2-fill me-2"></i><span data-i18n="admin_nav_dashboard">Dashboard</span>
    </a>
    <a class="btn rp-admin-btn d-flex align-items-center gap-2" href="./admin_orders.html">
      <i class="bi bi-box-seam"></i><span data-i18n="admin_nav_orders">Rendelések</span>
      <span class="rp-notif-bubble" data-admin-badge="orders" style="display:none;">0</span>
    </a>
    <a class="btn rp-admin-btn" href="./admin_categories.html">
      <i class="bi bi-tags me-2"></i><span data-i18n="admin_nav_categories">Kategóriák</span>
    </a>
    <a class="btn rp-admin-btn d-flex align-items-center gap-2" href="./admin_support.html">
      <i class="bi bi-life-preserver"></i><span data-i18n="admin_nav_support">Support</span>
      <span class="rp-notif-bubble" data-admin-badge="support" style="display:none;">0</span>
    </a>
    <a class="btn rp-admin-btn" href="./products.html">
      <i class="bi bi-arrow-left-circle me-2"></i><span data-i18n="admin_nav_storeview">Vissza a bolthoz</span>
    </a>
  </div>

  <!-- Search & Add bar -->
  <div class="rp-admin-card rp-reveal p-3 mb-3">
    <div class="d-flex flex-column flex-md-row gap-2 align-items-md-center justify-content-between">
      <input id="adminSearch" class="form-control rp-admin-input" data-i18n-ph="admin_search_ph" placeholder="Keresés (név)..."/>
      <div class="d-flex gap-2">
        <button id="adminAddProduct" class="btn rp-admin-btn">
          <i class="bi bi-plus-circle me-2"></i><span data-i18n="admin_new_product_btn">+ Új termék</span>
        </button>
        <button id="adminReload" class="btn rp-admin-btn" data-i18n="admin_reload">Újratöltés</button>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div id="adminTableWrap" class="rp-admin-card rp-reveal p-3">
    <div class="table-responsive">
      <table class="table table-sm align-middle mb-0 rp-admin-table">
        <thead>
          <tr>
            <th data-i18n="admin_th_id">ID</th>
            <th data-i18n="admin_th_name">Név</th>
            <th data-i18n="admin_th_category">Kategória</th>
            <th data-i18n="admin_th_image_url">Kép URL</th>
            <th data-i18n="admin_th_price">Ár</th>
            <th data-i18n="admin_th_stock">Készlet</th>
            <th data-i18n="admin_th_action">Művelet</th>
          </tr>
        </thead>
        <tbody id="adminTbody"></tbody>
      </table>
    </div>
    <div id="adminMsg" class="mt-2 small" style="opacity:.85;"></div>
  </div>
</main>

<!-- New product modal -->
<div class="modal fade" id="newProductModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="admin_new_product">Új termék</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label small fw-bold"><span data-i18n="admin_prod_name">Név</span> *</label>
          <input id="newPName" class="form-control" type="text" data-i18n-ph="admin_prod_name_ph"/>
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold"><span data-i18n="admin_prod_sku">SKU</span> *</label>
          <input id="newPSku" class="form-control" type="text" data-i18n-ph="admin_prod_sku_ph"/>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label small fw-bold" data-i18n="admin_prod_price">Ár</label> *
            <input id="newPPrice" class="form-control" type="number" min="0" step="1" placeholder="0"/>
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold" data-i18n="admin_prod_stock">Készlet</label> *
            <input id="newPStock" class="form-control" type="number" min="0" step="1" placeholder="0"/>
          </div>
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold"><span data-i18n="admin_prod_category">Kategória</span> *</label>
          <select id="newPCategory" class="form-select"></select>
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold"><span data-i18n="admin_prod_image_url">Kép URL</span></label>
          <input id="newPImageUrl" class="form-control" type="text" data-i18n-ph="admin_prod_image_url_ph"/>
        </div>
        <div id="newPMsg" class="mt-2 small" style="opacity:.9;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn rp-admin-btn" data-bs-dismiss="modal" data-i18n="admin_prod_cancel">Mégse</button>
        <button type="button" id="newPSave" class="btn rp-admin-btn"><i class="bi bi-check2 me-2"></i>Mentés</button>
      </div>
    </div>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="./assets/js/api.js"></script>
<script defer src="./assets/js/lang.js"></script>
<script defer src="./assets/js/nav.js"></script>
<script defer src="./assets/js/animate.js"></script>
<script defer src="./assets/js/admin.js"></script>
</body>
</html>
