<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Raktár Pro – Termékek</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./assets/css/common.css?v=28">
  <script>!function(){if(!localStorage.getItem("rp_theme"))localStorage.setItem("rp_theme","dark");document.documentElement.setAttribute("data-theme",localStorage.getItem("rp_theme"))}();</script>
  <link rel="stylesheet" href="./assets/css/nav-unify.css?v=28">
  <link rel="stylesheet" href="./assets/css/rp-luxury.css?v=28">
  <style>
    /* Márka filter chips */
    .rp-brand-chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
    .rp-brand-chip {
      padding:4px 10px; border-radius:999px; font-size:11px; font-weight:700;
      border:1px solid var(--glass-border); background:var(--glass);
      color:var(--text-dim); cursor:pointer; transition:all 120ms ease;
    }
    .rp-brand-chip:hover { color:var(--text); border-color:rgba(59,92,255,.35); background:rgba(59,92,255,.1); }
    .rp-brand-chip.active { background:rgba(59,92,255,.2); border-color:rgba(59,92,255,.5); color:var(--text); }
    [data-theme="light"] .rp-brand-chip { color:rgba(11,26,47,.65); }
    [data-theme="light"] .rp-brand-chip.active { color:#0b1628; }
    [data-theme="light"] .rp-brand-chip:hover { color:#0b1628; }
  
    /* ── PRICE RANGE SLIDER ── */
    .rp-slider-wrap { padding: 4px 0; }
    .rp-slider-labels { display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:8px; }
    .rp-slider-wrap { padding: 4px 0 2px; }
    .rp-range-track {
      position: relative;
      height: 4px;
      background: var(--glass-border);
      border-radius: 999px;
      margin: 22px 0 14px;
      overflow: visible;   /* critical: thumbs must not be clipped */
    }
    .rp-range-fill { position:absolute; height:100%; background:linear-gradient(90deg,#3b5cff,#0bc5ff); border-radius:999px; top:0; pointer-events:none; left:0; width:100%; }
    .rp-range-input {
      position: absolute;
      width: 100%;
      background: transparent;
      border: none; outline: none;
      -webkit-appearance: none; appearance: none;
      pointer-events: none;
      top: 50%; transform: translateY(-50%);
      left: 0; margin: 0; padding: 0; height: 4px;
    }
    .rp-range-input::-webkit-slider-runnable-track { background:transparent; height:4px; }
    .rp-range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #fff;
      border: 2.5px solid #3b5cff;
      box-shadow: 0 2px 10px rgba(59,92,255,.45);
      cursor: grab;
      pointer-events: all;
      margin-top: -8px;
      transition: transform 80ms, box-shadow 80ms;
    }
    .rp-range-input::-webkit-slider-thumb:hover { box-shadow: 0 2px 14px rgba(59,92,255,.7); }
    .rp-range-input::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.18); }
    .rp-range-input::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 2.5px solid #3b5cff;
      box-shadow: 0 2px 10px rgba(59,92,255,.45);
      cursor: grab;
      pointer-events: all;
    }
    .rp-range-input::-moz-range-track { background: transparent; }
    #priceRangeMin { z-index: 3; }
    #priceRangeMax { z-index: 2; }
    .rp-price-row { display: flex; gap: 8px; margin-top: 12px; }
    .rp-price-in {
      flex: 1; min-width: 0;
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 10px; padding: 7px 10px;
      color: var(--text); font-size: 12px; font-weight: 600;
      outline: none; transition: border-color 120ms;
    }
    .rp-price-in:focus { border-color: rgba(59,92,255,.5); }

    /* ── STAR FILTER ── */
    .rp-star-filter { display:flex; flex-direction:column; gap:4px; }
    .rp-star-btn { background:var(--glass); border:1px solid var(--glass-border); border-radius:10px; padding:7px 10px; cursor:pointer; transition:all 120ms; text-align:left; }
    .rp-star-btn:hover, .rp-star-btn.active { background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.35); }
    .rp-star-row { display:flex; align-items:center; gap:3px; font-size:13px; font-weight:600; color:var(--text); }
    .rp-star-row .bi-star-fill, .rp-star-row .bi-star-half { color:#f59e0b; font-size:12px; }
    .rp-star-row .bi-star { color:var(--glass-border); font-size:12px; }
    .rp-star-row span { margin-left:4px; font-size:12px; color:var(--text-dim); }

    /* ── IN-STOCK TOGGLE ── */
    .rp-toggle-label { display:flex; align-items:center; gap:10px; cursor:pointer; font-size:13px; font-weight:600; color:var(--text-dim); }
    .rp-toggle-label input { display:none; }
    .rp-toggle-slider { width:38px; height:20px; background:var(--glass-border); border-radius:999px; position:relative; flex-shrink:0; transition:background 120ms; }
    .rp-toggle-slider::after { content:''; position:absolute; width:14px; height:14px; border-radius:50%; background:#fff; top:3px; left:3px; transition:transform 120ms; }
    .rp-toggle-label input:checked + .rp-toggle-slider { background:linear-gradient(90deg,#3b5cff,#0bc5ff); }
    .rp-toggle-label input:checked + .rp-toggle-slider::after { transform:translateX(18px); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<nav class="rp-nav py-3">

    <a class="rp-brand" href="./home.html">

      <div>
        <div class="fw-bold">Raktár Pro</div>

    </a>
    <div class="d-flex align-items-center gap-2">

      <div class="dropdown">
        <button class="btn rp-pill-btn d-flex align-items-center gap-2 dropdown-toggle" data-bs-toggle="dropdown">
          <span class="rp-avatar" id="navAvatar">A</span>
          <span class="d-none d-md-inline">Fiók</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li id="adminMenuItem" style="display:none;"><a class="dropdown-item" href="./admin.html"><i class="bi bi-speedometer2 me-2"></i>Admin</a></li>
          <li id="adminMenuDivider" style="display:none;"><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="./account.html"><i class="bi bi-gear me-2"></i>Fiókbeállítások</a></li>

<main class="container">
  <div class="rp-page-header rp-anim-up">
    <div class="d-flex align-items-end justify-content-between flex-wrap gap-2">
      <div>
        <h1>Termékek</h1>
        <div class="rp-page-sub" id="productCount">Betöltés…</div>
      </div>
    </div>
  </div>

  <div class="rp-controls rp-anim-up rp-d2">
    <button class="rp-mobile-filter" id="mobileFilterBtn"><i class="bi bi-sliders"></i> Szűrők</button>
    <div class="rp-search-wrap">
      <i class="bi bi-search rp-search-ico"></i>
      <input type="text" class="rp-search-input" id="searchInput" placeholder="Keresés…">
    </div>
    <select class="rp-sort-select" id="sortSelect">
      <option value="default">Rendezés</option>
      <option value="price_asc">Ár ↑</option>
      <option value="price_desc">Ár ↓</option>
      <option value="name_asc">Név A→Z</option>
      <option value="stock_desc">Készlet ↓</option>
      <option value="rating_desc">Értékelés ↓</option>
    </select>
    <div class="rp-view-toggle">
      <button class="rp-view-btn active" id="gridViewBtn" title="Rács"><i class="bi bi-grid-3x3-gap-fill"></i></button>
      <button class="rp-view-btn" id="listViewBtn" title="Lista"><i class="bi bi-list-ul"></i></button>
    </div>
  </div>

  <div class="rp-chip-row mb-3" id="activeFilters"></div>

  <div class="rp-products-layout">
    <!-- SIDEBAR -->
    <aside class="rp-filter-sidebar rp-anim-left rp-d3" id="filterSidebar">
      <!-- Mobile close row -->
      <div id="filterCloseRow" style="display:none;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <span style="font-family:var(--font-display,sans-serif);font-weight:800;font-size:16px;">Szűrők</span>
        <button id="filterCloseBtn" style="background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;line-height:1;padding:0;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;">×</button>
      </div>
      <div class="rp-filter-section">
        <div class="rp-filter-title">Kategóriák</div>
        <button class="rp-filter-btn active" data-cat="all">
          <span class="rp-filter-name">Összes termék</span>
          <span class="rp-filter-count" id="cnt-all">—</span>
        </button>
        <div id="catList"></div>
      </div>

      <div class="rp-filter-section">
        <div class="rp-filter-title">Márkák</div>
        <div class="rp-brand-chips" id="brandList"></div>
      </div>

      <div class="rp-filter-section">
        <div class="rp-filter-title">Ár szűrő</div>
        <div class="rp-slider-wrap">
          <div class="rp-slider-labels">
            <span id="sliderMinLabel">0 Ft</span>
            <span id="sliderMaxLabel">700 000 Ft</span>
          </div>
          <div class="rp-range-track" id="rangeTrack">
            <div class="rp-range-fill" id="rangeFill"></div>
            <input type="range" class="rp-range-input" id="priceRangeMin" min="0" max="700000" step="5000" value="0">
            <input type="range" class="rp-range-input" id="priceRangeMax" min="0" max="700000" step="5000" value="700000">
          </div>
          <div class="rp-price-row" style="margin-top:10px;">
            <input type="number" class="rp-price-in" id="priceMin" placeholder="Min Ft" value="0">
            <input type="number" class="rp-price-in" id="priceMax" placeholder="Max Ft" value="700000">
          </div>
        </div>
        <button class="rp-filter-apply" id="applyPrice">Alkalmaz</button>
      </div>

      <div class="rp-filter-section">
        <div class="rp-filter-title">Értékelés</div>
        <div class="rp-star-filter" id="starFilter">
          <button class="rp-star-btn active" data-rating="0">
            <span class="rp-star-row">Összes</span>
          </button>
          <button class="rp-star-btn" data-rating="4">
            <span class="rp-star-row">
              <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star"></i>
              <span>4+ csillag</span>
            </span>
          </button>
          <button class="rp-star-btn" data-rating="4.5">
            <span class="rp-star-row">
              <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-half"></i>
              <span>4.5+ csillag</span>
            </span>
          </button>
          <button class="rp-star-btn" data-rating="5">
            <span class="rp-star-row">
              <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
              <span>5 csillag</span>
            </span>
          </button>
        </div>
      </div>

      <div class="rp-filter-section">
        <div class="rp-filter-title">Elérhetőség</div>
        <label class="rp-toggle-label">
          <input type="checkbox" id="inStockFilter">
          <span class="rp-toggle-slider"></span>

    </aside>

    <!-- PRODUCT GRID -->
    <div>
      <div class="rp-products-grid" id="productsGrid">
        <div class="rp-skel-card rp-skeleton"></div>
        <div class="rp-skel-card rp-skeleton"></div>
        <div class="rp-skel-card rp-skeleton"></div>
        <div class="rp-skel-card rp-skeleton"></div>
        <div class="rp-skel-card rp-skeleton"></div>
        <div class="rp-skel-card rp-skeleton"></div>
      </div>

  </div>
</main>

<div class="rp-toast" id="rpToast">

  <span id="toastMsg">Kosárba helyezve</span>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="./assets/js/rp-toast.js?v=28"></script>
<script defer src="./assets/js/api.js?v=28"></script>
<script defer src="./assets/js/nav.js?v=28"></script>
<script defer src="./assets/js/animate.js?v=28"></script>
<script defer src="./assets/js/products_new.js?v=28"></script>

<script>
// ── DARK MODE FORCE ──
(function(){
  // Mindig dark mode az alapértelmezett
  if (!localStorage.getItem('rp_theme')) {
    localStorage.setItem('rp_theme', 'dark');
  }
  document.documentElement.setAttribute('data-theme', localStorage.getItem('rp_theme'));
})();

// ── OLDALVÁLTÁS ANIMÁCIÓ + BFCACHE FIX ──
// bfcache fix: visszagomb esetén az oldal látható legyen
window.addEventListener('pageshow', function(e) {
  document.body.classList.remove('rp-page-out');
  document.body.style.opacity = '1';
  document.body.style.animation = 'none';
  // force reflow then re-enable animation
  void document.body.offsetHeight;
  document.body.style.animation = '';
});

document.addEventListener('click', function(e) {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const href = a.getAttribute('href');
  if (!href || href.startsWith('#') || href.startsWith('mailto') || href.startsWith('tel')) return;
  if (a.target === '_blank' || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (href.startsWith('http') && !href.includes('localhost')) return;
  e.preventDefault();
  document.body.classList.add('rp-page-out');
  setTimeout(() => { window.location.href = href; }, 80);
});
</script>
</body>
</html>
