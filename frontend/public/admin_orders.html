<script>
// ── DARK MODE FORCE ──
(function(){
  // Mindig dark mode az alapértelmezett
  if (!localStorage.getItem('rp_theme')) {
    localStorage.setItem('rp_theme', 'dark');
  }
  document.documentElement.setAttribute('data-theme', localStorage.getItem('rp_theme'));
})();

// ── OLDALVÁLTÁS ANIMÁCIÓ + BFCACHE FIX ──
// bfcache fix: visszagomb esetén az oldal látható legyen
window.addEventListener('pageshow', function(e) {
  document.body.classList.remove('rp-page-out');
  document.body.style.opacity = '1';
  document.body.style.animation = 'none';
  // force reflow then re-enable animation
  void document.body.offsetHeight;
  document.body.style.animation = '';
});

document.addEventListener('click', function(e) {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const href = a.getAttribute('href');
  if (!href || href.startsWith('#') || href.startsWith('mailto') || href.startsWith('tel')) return;
  if (a.target === '_blank' || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (href.startsWith('http') && !href.includes('localhost')) return;
  e.preventDefault();
  document.body.classList.add('rp-page-out');
  setTimeout(() => { window.location.href = href; }, 80);
});
</script>
