<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raktár Pro – Fiókbeállítások</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/common.css">
  <link rel="stylesheet" href="./assets/css/nav-unify.css">
</head>

<body>
  <nav class="rp-nav py-3">
    <div class="container d-flex align-items-center justify-content-between gap-3">
      <a class="rp-brand" href="./products.html">
        <div class="rp-logo"><img src="./assets/img/logo.png" alt="Raktár Pro logo" class="rp-logo-img"></div>
        <div>
          <div class="fw-bold">Raktár Pro</div>
          <div class="rp-subtitle">Professzionális raktári megoldások</div>
        </div>
      </a>

      <div class="d-flex align-items-center gap-2">
        <div class="rp-lang-flags">
          <button class="rp-lang-btn" type="button" data-lang="hu" title="Magyar">🇭🇺</button>
          <button class="rp-lang-btn" type="button" data-lang="en" title="English">🇬🇧</button>
          <button class="rp-lang-btn" type="button" data-lang="de" title="Deutsch">🇩🇪</button>
        </div>
        <button id="themeToggle" class="btn rp-pill-btn" type="button" data-i18n-title="theme_title_dark" title="Sötét mód">
          <i class="bi bi-moon-stars rp-icon" aria-hidden="true"></i>
        </button>

        <a class="btn rp-pill-btn position-relative" href="./cart.html" title="Kosár">
          <i class="bi bi-cart3 rp-icon" aria-hidden="true"></i>
          <span id="cartBadge" class="rp-badge" style="display:none;">0</span>
        </a>

        <div class="dropdown">
          <button class="btn rp-pill-btn d-flex align-items-center gap-2 dropdown-toggle"
                  data-bs-toggle="dropdown" aria-expanded="false">
            <span class="rp-avatar">A</span>
            <span class="d-none d-md-inline" data-i18n="nav_account">Fiók</span>
          </button>

          <ul class="dropdown-menu dropdown-menu-end">

            <li id="adminMenuItem" style="display:none;">
              <a class="dropdown-item" href="./admin.html"><i class="bi bi-speedometer2 me-2"></i><span data-i18n="nav_admin">Admin</span></a>
            </li>
            <li id="adminMenuDivider" style="display:none;"><hr class="dropdown-divider"></li>

            <li><a class="dropdown-item" href="./account.html"><i class="bi bi-gear me-2"></i><span data-i18n="nav_account_settings">Fiókbeállítások</span></a></li>
            <li><a class="dropdown-item" href="./orders.html"><i class="bi bi-receipt me-2"></i><span data-i18n="nav_orders">Rendeléseim</span></a></li>
            <li><a class="dropdown-item" href="./cart.html"><i class="bi bi-cart3 me-2"></i><span data-i18n="nav_cart">Kosár</span></a></li>

            <li><hr class="dropdown-divider"></li>

            <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i><span data-i18n="nav_logout">Kijelentkezés</span></a></li>
          </ul>

        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-3">
      <div>
        <h1 class="fw-bold m-0" data-i18n="account_title">Fiókbeállítások</h1>
        <div class="small opacity-75" data-i18n="account_subtitle">Profil, cím, jelszó, beállítások</div>
      </div>
      <div class="d-flex gap-2">
        <a class="btn rp-admin-btn" href="./orders.html"><i class="bi bi-receipt me-2"></i><span data-i18n="nav_orders">Rendeléseim</span></a>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-6">
        <div class="rp-admin-card p-3">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <div class="fw-bold" data-i18n="acc_profile">Profil</div>
            <div class="small opacity-75" id="accUserLine"></div>
          </div>

          <div class="mb-2">
            <label class="form-label small opacity-75 mb-1" data-i18n="fullname_label">Név</label>
            <input id="accName" class="form-control rp-admin-input" type="text" data-i18n-ph="fullname_ph" placeholder="Teljes név">
          </div>

          <div class="mb-2">
            <label class="form-label small opacity-75 mb-1" data-i18n="email_label">E-mail</label>
            <input id="accEmail" class="form-control rp-admin-input" type="email" placeholder="email@domain.hu" disabled>
          </div>

          <div class="d-flex gap-2 mt-3">
            <button id="accSaveProfile" class="btn rp-admin-btn" type="button">
              <i class="bi bi-check2-circle me-2"></i><span data-i18n="admin_orders_save">Mentés</span>
            </button>
            <div id="accMsgProfile" class="small opacity-75 align-self-center"></div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="rp-admin-card p-3">
          <div class="fw-bold mb-2" data-i18n="acc_shipping">Szállítási adatok</div>

          <div class="row g-2">
            <div class="col-5">
              <label class="form-label small opacity-75 mb-1" data-i18n="acc_zip">Irányítószám</label>
              <input id="accZip" class="form-control rp-admin-input" type="text" inputmode="numeric" autocomplete="postal-code" data-i18n-ph="acc_zip_ph" placeholder="pl. 9024">
            </div>
            <div class="col-7">
              <label class="form-label small opacity-75 mb-1" data-i18n="acc_city">Város</label>
              <input id="accCity" class="form-control rp-admin-input" type="text" autocomplete="address-level2" data-i18n-ph="acc_city_ph" placeholder="pl. Győr">
            </div>
            <div class="col-8">
              <label class="form-label small opacity-75 mb-1" data-i18n="acc_street">Utca</label>
              <input id="accStreet" class="form-control rp-admin-input" type="text" autocomplete="address-line1" data-i18n-ph="acc_street_ph" placeholder="pl. Fő utca">
            </div>
            <div class="col-4">
              <label class="form-label small opacity-75 mb-1" data-i18n="acc_house">Házszám</label>
              <input id="accHouse" class="form-control rp-admin-input" type="text" autocomplete="address-line2" data-i18n-ph="acc_house_ph" placeholder="pl. 12">
            </div>
            <div class="col-12">
              <label class="form-label small opacity-75 mb-1" data-i18n="acc_extra">Emelet / ajtó (opcionális)</label>
              <input id="accExtra" class="form-control rp-admin-input" type="text" data-i18n-ph="acc_extra_ph" placeholder="pl. 2. emelet 5. ajtó">
            </div>
          </div>

          <div class="d-flex gap-2 mt-3">
            <button id="accSaveAddress" class="btn rp-admin-btn" type="button">
              <i class="bi bi-geo-alt me-2"></i><span data-i18n="acc_save_address">Cím mentése</span>
            </button>
            <div id="accMsgAddress" class="small opacity-75 align-self-center"></div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="rp-admin-card p-3">
          <div class="fw-bold mb-2" data-i18n="acc_password">Jelszó</div>

          <div class="mb-2">
            <label class="form-label small opacity-75 mb-1" data-i18n="acc_pw_old">Jelenlegi jelszó</label>
            <input id="accPwOld" class="form-control rp-admin-input" type="password" placeholder="••••••••">
          </div>

          <div class="mb-2">
            <label class="form-label small opacity-75 mb-1" data-i18n="acc_pw_new">Új jelszó</label>
            <input id="accPwNew" class="form-control rp-admin-input" type="password" data-i18n-ph="acc_pw_new_ph" placeholder="Minimum 6 karakter">
          </div>

          <div class="d-flex gap-2 mt-3">
            <button id="accSavePw" class="btn rp-admin-btn" type="button">
              <i class="bi bi-shield-lock me-2"></i><span data-i18n="acc_pw_change">Jelszó csere</span>
            </button>
            <div id="accMsgPw" class="small opacity-75 align-self-center"></div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="rp-admin-card p-3">
          <div class="fw-bold mb-2" data-i18n="acc_security">Biztonság</div>

          <div class="small opacity-75 mb-2" data-i18n="acc_logout_all_desc">Kijelentkezés minden eszközről</div>

          <div class="d-flex gap-2">
            <button id="accLogoutAll" class="btn rp-admin-btn-danger" type="button">
              <i class="bi bi-box-arrow-right me-2"></i><span data-i18n="nav_logout">Kijelentkezés</span>
            </button>
            <div id="accMsgSec" class="small opacity-75 align-self-center"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/lang.js"></script>
  <script src="./assets/js/nav.js"></script>
  <script src="./assets/js/account.js"></script>
</body>
</html>
