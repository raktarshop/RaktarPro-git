<!doctype html>
<html lang="hu">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raktár Pro – Support</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/common.css">
    <link rel="stylesheet" href="./assets/css/nav-unify.css">
<link rel="stylesheet" href="./assets/css/auth.css">
</head>

<body class="rp-auth">
  <nav class="rp-nav py-3">
    <div class="container d-flex align-items-center justify-content-between gap-3">
      <a class="rp-brand" href="./products.html">
        <div class="rp-logo"><img src="./assets/img/logo.png" alt="Raktár Pro logo" class="rp-logo-img"></div>
        <div>
          <div class="fw-bold">Raktár Pro</div>
          <div class="rp-subtitle" data-i18n="nav_subtitle">Professzionális raktári megoldások</div>
        </div>
      </a>

      <div class="d-flex align-items-center gap-2">
        <div class="rp-lang-flags">
        <button class="rp-lang-btn" type="button" data-lang="hu" title="Magyar">🇭🇺</button>
        <button class="rp-lang-btn" type="button" data-lang="en" title="English">🇬🇧</button>
        <button class="rp-lang-btn" type="button" data-lang="de" title="Deutsch">🇩🇪</button>
      </div>
      <button id="themeToggle" class="btn rp-pill-btn" type="button" data-i18n-title="theme_title_dark" title="Sötét mód">
          <i class="bi bi-moon-stars rp-icon" aria-hidden="true"></i>
        </button>

        <a class="btn rp-pill-btn position-relative" href="./cart.html" title="Kosár">
          <i class="bi bi-cart3 rp-icon" aria-hidden="true"></i>
          <span id="cartBadge" class="rp-badge" style="display:none;">0</span>
        </a>

        <div class="dropdown"> 
          <button class="btn rp-pill-btn d-flex align-items-center gap-2 dropdown-toggle"
                  data-bs-toggle="dropdown" aria-expanded="false">
            <span class="rp-avatar">A</span>
            <span class="d-none d-md-inline" data-i18n="nav_account">Fiók</span>
          </button>

          <ul class="dropdown-menu dropdown-menu-end">

            <li id="adminMenuItem" style="display:none;">
              <a class="dropdown-item" href="./admin.html"><i class="bi bi-speedometer2 me-2"></i><span data-i18n="nav_admin">Admin</span></a>
            </li>
            <li id="adminMenuDivider" style="display:none;"><hr class="dropdown-divider"></li>

            <li><a class="dropdown-item" href="./account.html"><i class="bi bi-gear me-2"></i><span data-i18n="nav_account_settings">Fiókbeállítások</span></a></li>
            <li><a class="dropdown-item" href="./orders.html"><i class="bi bi-receipt me-2"></i><span data-i18n="nav_orders">Rendeléseim</span></a></li>
            <li><a class="dropdown-item" href="./cart.html"><i class="bi bi-cart3 me-2"></i><span data-i18n="nav_cart">Kosár</span></a></li>

            <li><hr class="dropdown-divider"></li>

            <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i><span data-i18n="nav_logout">Kijelentkezés</span></a></li>
          </ul>

        </div>
      </div>
    </div>
  </nav>

  <div class="rp-auth-wrap">
    <div class="rp-auth-card">

      <div class="d-flex align-items-start justify-content-between gap-3 mb-3">
        <div>
          <div class="rp-auth-title" data-i18n="support_title">Belépési segítség</div>
          <div class="rp-auth-sub" data-i18n="support_subtitle">Írj az adminnak, és hamarosan válaszolunk.</div>
        </div>
        <a class="rp-help-link" href="./auth.html" data-i18n="support_back_login">← Vissza a bejelentkezéshez</a>
      </div>

      <form id="supportForm" action="javascript:void(0)" novalidate>
        <div class="mb-2">
          <label class="form-label rp-label" data-i18n="support_email_label">E-mail cím</label>
          <input class="form-control rp-input rp-input-sm" type="email" id="supportEmail" required data-i18n-ph="support_email_ph" />
        </div>

        <div class="mb-2">
          <label class="form-label rp-label" data-i18n="support_msg_label">Mi a hiba?</label>
          <textarea class="form-control rp-input" id="supportMessage" rows="5" required data-i18n-ph="support_msg_ph"></textarea>
        </div>

        <div class="rp-error mt-2" id="supportError" style="display:none;"></div>
        <div class="rp-success mt-2" id="supportSuccess" style="display:none;"></div>

        <button class="btn rp-primary w-100 mt-3 rp-primary-sm" type="submit" data-i18n="support_send_btn">Üzenet küldése</button>
      </form>
    </div>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="./assets/js/api.js"></script>
  <script defer src="./assets/js/lang.js"></script>
    <script defer src="./assets/js/nav.js"></script>
<script defer src="./assets/js/support.js"></script>
</body>

</html>
