<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Raktár Pro – Kategóriák</title>
  <script>!function(){if(!localStorage.getItem("rp_theme"))localStorage.setItem("rp_theme","dark");document.documentElement.setAttribute("data-theme",localStorage.getItem("rp_theme"))}();</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./assets/css/common.css?v=27">
  <link rel="stylesheet" href="./assets/css/nav-unify.css?v=27">
  <link rel="stylesheet" href="./assets/css/admin.css?v=27">
  <link rel="stylesheet" href="./assets/css/rp-luxury.css?v=27">
  <link rel="stylesheet" href="./assets/css/mobile.css?v=27">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root{--font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;}
    body{font-family:var(--font-body);}

    /* ── SECTION LABEL ── */
    .cat-section-label {
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-dim);
      margin-bottom: 10px; padding-left: 2px;
    }

    /* ── ADD BOX ── */
    .cat-add-box {
      background: var(--glass);
      border: 1.5px dashed var(--glass-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 10px;
      transition: border-color 120ms;
      margin-bottom: 8px;
    }
    .cat-add-box:focus-within {
      border-color: rgba(59,92,255,.6);
      border-style: solid;
      box-shadow: 0 0 0 3px rgba(59,92,255,.08);
    }
    .cat-add-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 14px; font-family: var(--font-body);
    }
    .cat-add-input::placeholder { color: var(--text-dim); }
    .cat-add-btn {
      padding: 8px 20px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #3b5cff, #0bc5ff);
      color: #fff; font-weight: 700; font-size: 13px;
      cursor: pointer; white-space: nowrap;
      transition: opacity 120ms, transform 120ms;
      box-shadow: 0 2px 12px rgba(59,92,255,.3);
    }
    .cat-add-btn:hover { opacity: .88; transform: translateY(-1px); }
    .cat-add-btn:disabled { opacity: .4; pointer-events: none; box-shadow: none; }

    .cat-msg { font-size: 12px; min-height: 20px; margin-bottom: 16px; font-weight: 600; }

    /* ── GRID ── */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }

    /* ── CARD ── */
    .cat-card {
      background: var(--card, var(--glass));
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 120ms, box-shadow 120ms, transform 120ms;
      cursor: default;
    }
    .cat-card:hover {
      border-color: rgba(59,92,255,.45);
      box-shadow: 0 4px 18px rgba(59,92,255,.12);
      transform: translateY(-2px);
    }
    .cat-card-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }

    .cat-icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(59,92,255,.15), rgba(11,197,255,.1));
      border: 1px solid rgba(59,92,255,.2);
      display: grid; place-items: center;
      font-size: 18px; flex-shrink: 0; color: #6b8cff;
    }
    .cat-info { flex: 1; min-width: 0; }
    .cat-name {
      font-weight: 700; font-size: 14px;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.3;
    }
    .cat-id {
      font-size: 11px; color: var(--text-dim);
      margin-top: 2px; font-weight: 500;
      font-family: 'DM Mono', monospace, var(--font-body);
    }

    .cat-del-btn {
      width: 34px; height: 34px;
      border-radius: 10px; border: none;
      background: rgba(239,68,68,.08);
      color: #ef4444;
      display: grid; place-items: center;
      cursor: pointer; font-size: 14px; flex-shrink: 0;
      transition: background 120ms, transform 120ms;
    }
    .cat-del-btn:hover { background: rgba(239,68,68,.2); transform: scale(1.1); }
    .cat-del-btn:disabled { opacity: .35; pointer-events: none; }

    /* ── EMPTY STATE ── */
    .cat-empty {
      text-align: center; padding: 56px 20px;
      color: var(--text-dim); font-size: 14px;
      grid-column: 1 / -1;
    }
    .cat-empty i { font-size: 40px; opacity: .2; display: block; margin-bottom: 14px; }

    /* ── COUNTER BADGE ── */
    .cat-count-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(59,92,255,.12); color: #6b8cff;
      border-radius: 999px; padding: 2px 10px;
      font-size: 12px; font-weight: 700; margin-left: 8px;
    }
  </style>
</head>
<body>

<nav class="rp-nav py-3">
  <div class="container d-flex align-items-center justify-content-between gap-3">
    <a class="rp-brand" href="./home.html">
      <div class="rp-logo"><img src="./assets/img/logo.png" alt="" class="rp-logo-img"></div>
      <div><div class="fw-bold">Raktár Pro</div><div class="rp-subtitle">Admin</div></div>
    </a>
    <div class="d-flex align-items-center gap-2">
      <button id="themeToggle" class="btn rp-pill-btn" type="button"><i class="bi bi-moon-stars rp-icon"></i></button>
      <a class="btn rp-pill-btn position-relative" href="./cart.html">
        <i class="bi bi-cart3 rp-icon"></i>
        <span id="cartBadge" class="rp-badge" style="display:none;">0</span>
      </a>
      <div class="dropdown">
        <button class="btn rp-pill-btn d-flex align-items-center gap-2 dropdown-toggle" data-bs-toggle="dropdown">
          <span class="rp-avatar" id="navAvatar">A</span>
          <span class="d-none d-md-inline">Fiók</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li id="adminMenuItem"><a class="dropdown-item" href="./admin.html"><i class="bi bi-speedometer2 me-2"></i>Admin</a></li>
          <li id="adminMenuDivider"><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="./account.html"><i class="bi bi-gear me-2"></i>Beállítások</a></li>
          <li><a class="dropdown-item" href="./orders.html"><i class="bi bi-receipt me-2"></i>Rendeléseim</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Kijelentkezés</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">

  <!-- Page header -->
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
    <div>
      <h1 class="rp-reveal" style="font-family:var(--font-display);font-size:26px;font-weight:900;margin:0;letter-spacing:-.02em;">
        Kategóriák kezelése
        <span class="cat-count-badge" id="catCountBadge" style="vertical-align:middle;"></span>
      </h1>
      <p style="color:var(--text-dim);font-size:13px;margin-top:4px;margin-bottom:0;">Termék kategóriák hozzáadása és törlése</p>
    </div>
  </div>

  <!-- Admin nav tabs -->
  <div class="d-flex flex-wrap gap-2 mb-5">
    <a class="btn rp-admin-btn" href="./admin.html"><i class="bi bi-grid-1x2-fill me-2"></i>Dashboard</a>
    <a class="btn rp-admin-btn d-flex align-items-center gap-2" href="./admin_orders.html">
      <i class="bi bi-box-seam"></i>Rendelések
      <span class="rp-notif-bubble" data-admin-badge="orders" style="display:none;">0</span>
    </a>
    <a class="btn rp-admin-btn d-flex align-items-center gap-2" href="./admin_support.html">
      <i class="bi bi-life-preserver"></i>Support
      <span class="rp-notif-bubble" data-admin-badge="support" style="display:none;">0</span>
    </a>
    <a class="btn rp-admin-btn" href="./admin_finance.html"><i class="bi bi-graph-up-arrow me-2"></i>Pénzügyek</a>
    <a class="btn rp-admin-btn active" href="./admin_categories.html"><i class="bi bi-tags me-2"></i>Kategóriák</a>
    <a class="btn rp-admin-btn" href="./products.html"><i class="bi bi-arrow-left-circle me-2"></i>Vissza a bolthoz</a>
  </div>

  <!-- Add new -->
  <div class="mb-2">
    <div class="cat-section-label"><i class="bi bi-plus-circle me-1"></i>Új kategória</div>
    <div class="cat-add-box rp-reveal">
      <div style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,rgba(59,92,255,.15),rgba(11,197,255,.1));border:1px solid rgba(59,92,255,.2);display:grid;place-items:center;flex-shrink:0;">
        <i class="bi bi-tag" style="color:#6b8cff;font-size:16px;"></i>
      </div>
      <input class="cat-add-input" id="catName" placeholder="Kategória neve (pl. Robotika, Okosotthon…)" maxlength="80">
      <button class="cat-add-btn" id="catAdd"><i class="bi bi-plus-lg me-1"></i>Hozzáadás</button>
    </div>
    <div class="cat-msg" id="catsMsg"></div>
  </div>

  <!-- Grid -->
  <div class="cat-section-label mt-4"><i class="bi bi-grid me-1"></i>Meglévő kategóriák</div>
  <div class="cat-grid rp-reveal" id="catGrid">
    <div class="cat-empty"><i class="bi bi-hourglass-split"></i>Betöltés…</div>
  </div>
</main>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="./assets/js/rp-toast.js?v=27"></script>
<script defer src="./assets/js/api.js?v=27"></script>
<script defer src="./assets/js/nav.js?v=27"></script>
<script defer src="./assets/js/animate.js?v=27"></script>
<script defer src="./assets/js/admin_categories.js?v=27"></script>
<script>
window.addEventListener('pageshow', function() {
  document.body.classList.remove('rp-page-out');
  document.body.style.opacity = '';
  document.body.style.animation = 'none';
  void document.body.offsetHeight;
  document.body.style.animation = '';
});
document.addEventListener('click', function(e) {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const href = a.getAttribute('href');
  if (!href || href.startsWith('#') || href.startsWith('mailto') || href.startsWith('tel')) return;
  if (a.target === '_blank' || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (href.startsWith('http') && !href.includes('localhost')) return;
  e.preventDefault();
  document.body.classList.add('rp-page-out');
  setTimeout(function(){ window.location.href = href; }, 80);
});
</script>
</body>
</html>
