<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raktár Pro – Kosár</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./assets/css/common.css?v=25">
  <script>!function(){var t=localStorage.getItem("rp_theme")||"dark";document.documentElement.setAttribute("data-theme",t)}();</script>

  <link rel="stylesheet" href="./assets/css/nav-unify.css?v=25">
  <link rel="stylesheet" href="./assets/css/cart.css?v=25">
  <link rel="stylesheet" href="./assets/css/rp-luxury.css?v=25">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>:root{--font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;}body{font-family:var(--font-body,'DM Sans',sans-serif);}</style>
</head>

<body>
<div class="rp-progress-bar" id="progressBar"></div>
  <!-- NAV -->
  <nav class="rp-nav py-3">
  <div class="container d-flex align-items-center justify-content-between gap-3">
    <a class="rp-brand" href="./home.html">
      <div class="rp-logo"><img src="./assets/img/logo.png" alt="Raktár Pro logo" class="rp-logo-img"></div>
      <div>
        <div class="fw-bold">Raktár Pro</div>
        <div class="rp-subtitle">Professzionális raktári megoldások</div>
      </div>
    </a>
    <div class="d-flex align-items-center gap-2">
      <button id="themeToggle" class="btn rp-pill-btn" type="button">
        <i class="bi bi-moon-stars rp-icon"></i>
      </button>
      <a class="btn rp-pill-btn position-relative" href="./favorites.html" title="Kedvencek">
        <i class="bi bi-heart rp-icon"></i>
        <span id="favBadge" class="rp-badge" style="display:none;">0</span>
      </a>
      <a class="btn rp-pill-btn position-relative" href="./cart.html">
        <i class="bi bi-cart3 rp-icon"></i>
        <span id="cartBadge" class="rp-badge" style="display:none;">0</span>
      </a>
      <div class="dropdown">
        <button class="btn rp-pill-btn d-flex align-items-center gap-2 dropdown-toggle" data-bs-toggle="dropdown">
          <span class="rp-avatar" id="navAvatar">A</span>
          <span class="d-none d-md-inline">Fiók</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li id="adminMenuItem" style="display:none;"><a class="dropdown-item" href="./admin.html"><i class="bi bi-speedometer2 me-2"></i>Admin</a></li>
          <li id="adminMenuDivider" style="display:none;"><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="./account.html"><i class="bi bi-gear me-2"></i>Fiókbeállítások</a></li>
          <li><a class="dropdown-item" href="./favorites.html"><i class="bi bi-heart me-2"></i>Kedvencek</a></li>
          <li><a class="dropdown-item" href="./orders.html"><i class="bi bi-receipt me-2"></i>Rendeléseim</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Kijelentkezés</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

  <main class="container py-4">
    <h1 class="rp-page-title mb-3 rp-reveal" data-i18n="cart_title">Kosár</h1>

    <div class="rp-panel mb-3 rp-reveal" id="cartList"></div>

    <div class="rp-summary d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 rp-reveal">
      <div class="rp-total">
        <span data-i18n="cart_total">Összesen:</span> <span id="cartTotal">0 Ft</span>
      </div>

      <div class="d-flex gap-2">
        <a href="./products.html" class="btn rp-btn" data-i18n="continue_shopping">
          <i class="bi bi-arrow-left rp-icon" aria-hidden="true"></i> Vásárlás folytatása
        </a>
        <button class="btn rp-btn-primary" id="checkoutBtn" data-i18n="checkout">
          Tovább a fizetéshez <i class="bi bi-arrow-right rp-icon" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </main>

  <!-- Checkout modal (Utánvét / Cash on delivery) -->
  <div class="modal fade" id="checkoutModal" tabindex="-1" aria-labelledby="checkoutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rp-modal">
        <div class="modal-header">
          <h5 class="modal-title" id="checkoutModalLabel" data-i18n="checkout_modal_title">Fizetés</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div id="checkoutAlert" class="rp-alert" style="display:none;"></div>

          <form id="checkoutForm" novalidate>
            <div class="mb-2">
              <label class="form-label" data-i18n="checkout_name_label">Név</label>
              <input class="form-control rp-input" id="checkoutName" type="text" required data-i18n-ph="checkout_name_ph" placeholder="Teljes név" />
            </div>

            <div class="mb-2">
              <label class="form-label" data-i18n="checkout_email_label">E-mail</label>
              <input class="form-control rp-input" id="checkoutEmail" type="email" required data-i18n-ph="checkout_email_ph" placeholder="pl. hello@ceg.hu" />
            </div>

            <!-- ✅ Split address fields -->
            <div class="mb-1">
              <label class="form-label">Szállítási cím</label>
            </div>

            <div class="row g-2">
              <div class="col-5">
                <input class="form-control rp-input" id="checkoutZip" type="text" inputmode="numeric" autocomplete="postal-code" data-i18n-ph="acc_zip_ph"
                       placeholder="Irányítószám" required />
              </div>
              <div class="col-7">
                <input class="form-control rp-input" id="checkoutCity" type="text" autocomplete="address-level2"
                       placeholder="Város" required />
              </div>
              <div class="col-8">
                <input class="form-control rp-input" id="checkoutStreet" type="text" autocomplete="address-line1"
                       placeholder="Utca" required />
              </div>
              <div class="col-4">
                <input class="form-control rp-input" id="checkoutHouse" type="text" autocomplete="address-line2"
                       placeholder="Házszám" required />
              </div>
              <div class="col-12">
                <input class="form-control rp-input" id="checkoutAddressExtra" type="text"
                       placeholder="Emelet / ajtó / megjegyzés (opcionális)" />
              </div>
            </div>

            <div class="mb-2 mt-2">
              <label class="form-label" data-i18n="checkout_payment_label">Fizetési mód</label>
              <select class="form-select rp-input" id="checkoutPaymentMethod">
                <option value="utanvet" data-i18n="checkout_payment_cod">Utánvét (készpénz/átvételkor)</option>
                
              </select>
            </div>

            <div class="rp-checkout-total">
              <span data-i18n="checkout_total_label">Fizetendő:</span>
              <strong id="checkoutTotal">0 Ft</strong>
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn rp-btn" data-bs-dismiss="modal" data-i18n="checkout_cancel">Mégse</button>
          <button type="button" class="btn rp-btn-primary" id="placeOrderBtn" data-i18n="checkout_place_order">Rendelés leadása</button>
        </div>
      </div>
    </div>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="./assets/js/rp-toast.js?v=25"></script>
  <script defer src="./assets/js/api.js?v=25"></script>
  <script defer src="./assets/js/nav.js?v=25"></script>
  <script defer src="./assets/js/animate.js?v=25"></script>
  <script defer src="./assets/js/cart.js?v=25"></script>
<script>window.addEventListener("scroll",function(){var p=document.getElementById("progressBar");if(p){var pct=window.scrollY/(document.documentElement.scrollHeight-window.innerHeight)*100;p.style.width=Math.min(pct,100)+"%";}},{passive:true});</script>
</body>
</html>
