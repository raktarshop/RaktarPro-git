  <style>
    :root { --font-display:'Syne',sans-serif; --font-body:'DM Sans',sans-serif; }
    *, *::before, *::after { box-sizing:border-box; }
    body {
      font-family: var(--font-body);
      background:
        radial-gradient(ellipse 1100px 700px at 15% 0%, rgba(59,92,255,0.14), transparent 60%),
        radial-gradient(ellipse 900px 600px at 88% 20%, rgba(11,197,255,0.09), transparent 55%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text);
    }
    /* NAV */
    .hp-nav {
      position: sticky; top:0; z-index:1000;
      background: var(--nav-bg);
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(24px) saturate(1.6);
      padding: 0 24px; height: 64px;
      display: flex; align-items: center; gap: 24px;
    }
    .hp-nav-brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); font-family:var(--font-display); font-size:18px; font-weight:800; flex-shrink:0; }
    .hp-nav-brand img { width:36px; height:36px; border-radius:12px; }
    .hp-nav-links { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; flex:1; }
    .hp-nav-links::-webkit-scrollbar { display:none; }
    .hp-nav-link { white-space:nowrap; padding:6px 14px; border-radius:999px; border:1px solid transparent; font-size:13px; font-weight:600; color:var(--text-dim); background:transparent; cursor:pointer; transition:all 130ms ease; text-decoration:none; display:inline-block; }
    .hp-nav-link:hover, .hp-nav-link.active { color:var(--text); background:var(--glass); border-color:var(--glass-border); }
    .hp-nav-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .hp-nav-btn { width:40px; height:40px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass); color:var(--text); display:grid; place-items:center; cursor:pointer; text-decoration:none; transition:all 130ms ease; position:relative; font-size:16px; }
    .hp-nav-btn:hover { background:var(--btn-ghost-bg); color:var(--text); }
    .hp-badge { position:absolute; top:-5px; right:-5px; min-width:18px; height:18px; border-radius:999px; background:#ef4444; color:#fff; font-size:10px; font-weight:800; display:grid; place-items:center; border:2px solid var(--bg); padding:0 3px; }

    /* PAGE */
    .fav-page { max-width:1200px; margin:0 auto; padding:40px 24px; }
    .fav-header { margin-bottom:32px; }
    .fav-header h1 { font-family:var(--font-display); font-size:clamp(28px,4vw,48px); font-weight:900; margin:0 0 6px; }
    .fav-header p { color:var(--text-dim); font-size:15px; margin:0; }

    /* GRID */
    .fav-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; }

    /* CARD */
    .fav-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      overflow: hidden;
      transition: all 200ms ease;
      cursor: pointer;
      position: relative;
    }
    .fav-card:hover { transform:translateY(-4px); box-shadow:0 16px 48px rgba(0,0,0,0.2); border-color:rgba(59,92,255,0.35); }
    .fav-card-img { width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--glass); }
    .fav-card-body { padding:16px; }
    .fav-card-cat { font-size:11px; font-weight:700; color:rgba(59,92,255,0.9); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
    .fav-card-name { font-weight:700; font-size:15px; line-height:1.3; margin-bottom:8px; }
    .fav-card-stars { display:flex; align-items:center; gap:4px; margin-bottom:10px; }
    .fav-card-stars .star { color:#f59e0b; font-size:13px; }
    .fav-card-stars .star.empty { color:var(--glass-border); }
    .fav-card-stars .rat-num { font-size:12px; color:var(--text-dim); margin-left:2px; }
    .fav-card-price { font-size:20px; font-weight:900; color:var(--text); margin-bottom:14px; }
    .fav-card-actions { display:flex; gap:8px; }
    .btn-fav-cart { flex:1; padding:9px 12px; border-radius:10px; background:linear-gradient(135deg,#3b5cff,#0bc5ff); color:#fff; font-weight:700; font-size:13px; border:0; cursor:pointer; transition:all 150ms; }
    .btn-fav-cart:hover { opacity:.9; transform:translateY(-1px); }
    .btn-fav-remove { width:38px; height:38px; border-radius:10px; border:1px solid var(--glass-border); background:transparent; color:#ef4444; cursor:pointer; display:grid; place-items:center; font-size:15px; transition:all 150ms; }
    .btn-fav-remove:hover { background:rgba(239,68,68,0.1); }

    /* EMPTY */
    .fav-empty { text-align:center; padding:80px 20px; }
    .fav-empty i { font-size:64px; color:var(--text-dim); opacity:.4; margin-bottom:20px; display:block; }
    .fav-empty h3 { font-family:var(--font-display); font-size:24px; margin-bottom:8px; }
    .fav-empty p { color:var(--text-dim); margin-bottom:24px; }
    .btn-browse { display:inline-block; padding:12px 28px; border-radius:14px; background:linear-gradient(135deg,#3b5cff,#0bc5ff); color:#fff; font-weight:700; text-decoration:none; }

    /* Toast */
    .rp-toast { position:fixed; bottom:28px; right:28px; background:var(--glass); border:1px solid var(--glass-border); border-radius:16px; padding:14px 20px; font-size:14px; font-weight:600; backdrop-filter:blur(16px); z-index:9999; opacity:0; transform:translateY(16px); transition:all 250ms ease; pointer-events:none; }
    .rp-toast.show { opacity:1; transform:translateY(0); }

    /* Theme toggle */
    .theme-toggle { background:none; border:1px solid var(--glass-border); color:var(--text); border-radius:12px; width:40px; height:40px; display:grid; place-items:center; cursor:pointer; transition:all 130ms; }
    .theme-toggle:hover { background:var(--glass); }
  </style>
</head>

<div class="fav-page">
  <div class="fav-header">

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ── UTILS ──
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function fmt(n){return Math.round(Number(n)||0).toLocaleString('hu-HU')+' Ft';}
function getWishlist(){try{return new Set(JSON.parse(localStorage.getItem('rp_wishlist')||'[]'));}catch{return new Set();}}
function saveWishlist(s){localStorage.setItem('rp_wishlist',JSON.stringify([...s]));}
function getCart(){try{return JSON.parse(localStorage.getItem('rp_cart')||'[]');}catch{return[];}}
function saveCart(c){localStorage.setItem('rp_cart',JSON.stringify(c));}

function toast(msg,type='success'){
  const el=document.getElementById('rpToast');
  if(!el)return;
  el.textContent=msg;
  el.style.borderColor=type==='success'?'rgba(16,185,129,.4)':'rgba(239,68,68,.4)';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),2200);
}

function renderStars(avg){
  const r=Math.round((avg||0)*2)/2;
  return [1,2,3,4,5].map(i=>{
    if(r>=i) return '<i class="bi bi-star-fill star"></i>';
    if(r>=i-0.5) return '<i class="bi bi-star-half star"></i>';
    return '<i class="bi bi-star star empty"></i>';
  }).join('');
}

// Product photos map (same as products_new.js)
const PHOTOS={

const FALLBACK=['https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=400&h=400&fit=crop','https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=400&fit=crop','https://images.unsplash.com/photo-1560472354-b33ff0c44a43?w=400&h=400&fit=crop'];

function getPhoto(p){
  if(p.image_url&&p.image_url.startsWith('./imgs/'))return p.image_url;
  if(p.image_url&&p.image_url.startsWith('http'))return p.image_url;
  const n=(p.name||'').toLowerCase();
  for(const[k,u]of Object.entries(PHOTOS)){if(n.includes(k))return u;}
  return FALLBACK[(p.id||0)%FALLBACK.length];
}

// Demo product data cache — same IDs as products_new.js
const DEMO_PRODUCTS_MAP = {
  1:{name:'iPhone 15 Pro',unit_price:160000,category_name:'Mobil',avg_rating:4.8,review_count:124},
  2:{name:'Samsung Galaxy S24 Ultra',unit_price:170000,category_name:'Mobil',avg_rating:4.7,review_count:98},
  3:{name:'ASUS ROG Strix G16',unit_price:180000,category_name:'Gaming',avg_rating:4.6,review_count:67},
  4:{name:'MacBook Air M2',unit_price:190000,category_name:'Laptop',avg_rating:4.9,review_count:203},
  5:{name:'Dell XPS 13 Plus',unit_price:200000,category_name:'Laptop',avg_rating:4.5,review_count:55},
  6:{name:'Sony WH-1000XM5',unit_price:110000,category_name:'Audio',avg_rating:4.8,review_count:312},
  7:{name:'Apple AirPods Pro 2',unit_price:120000,category_name:'Audio',avg_rating:4.7,review_count:445},
  8:{name:'Samsung Galaxy Tab S9',unit_price:130000,category_name:'Tablet',avg_rating:4.6,review_count:89},
  9:{name:'iPad Pro 12.9"',unit_price:140000,category_name:'Tablet',avg_rating:4.8,review_count:176},
  10:{name:'Logitech MX Master 3S',unit_price:45000,category_name:'Kiegészítő',avg_rating:4.9,review_count:534},
};

async function loadFavorites(){
  const grid=document.getElementById('favGrid');
  const countEl=document.getElementById('favCount');
  const ws=getWishlist();

  if(!ws.size){
    grid.innerHTML=`<div class="fav-empty" style="grid-column:1/-1">
      <i class="bi bi-heart"></i>
      <h3>Még nincsenek kedvenceid</h3>
      <p>Böngéssz a termékek között és kattints a szív ikonra!</p>
      <a href="./products.html" class="btn-browse">Termékek böngészése</a>
    </div>`;
    countEl.textContent='0 kedvenc termék';
    return;
  }

  // Try API first
  let products=[];
  try{
    if(window.api){
      const res=await window.api.post('/products/by-ids',{ids:[...ws].map(Number)});
      products=res?.data?.products??res?.products??[];
    }
  }catch(e){console.log('Fav API error:', e.message);}

  // Fallback: build from demo map + wishlist IDs
  if(!products.length){
    products=[...ws].map(id=>{
      const num=Number(id);
      const demo=DEMO_PRODUCTS_MAP[num];
      return demo
        ? {id:num,...demo}
        : {id:num,name:'Termék #'+id,unit_price:0,category_name:'Termék',avg_rating:0,review_count:0};
    });
  }

  countEl.textContent=products.length+' kedvenc termék';

  grid.innerHTML=products.map(p=>{
    const avg=parseFloat(p.avg_rating)||0;
    const cnt=parseInt(p.review_count)||0;
    return `<div class="fav-card" onclick="window.location.href='./product_details.html?id=${p.id}'">
      <img class="fav-card-img" src="${esc(getPhoto(p))}" alt="${esc(p.name)}" loading="lazy" onerror="this.src='${FALLBACK[0]}'">
      <div class="fav-card-body">
        <div class="fav-card-cat">${esc(p.category_name||'Termék')}</div>
        <div class="fav-card-name">${esc(p.name)}</div>
        <div class="fav-card-stars">
          ${renderStars(avg)}
          <span class="rat-num">${avg>0?avg.toFixed(1)+' ('+cnt+')':'Értékelés nélkül'}</span>
        </div>
        <div class="fav-card-price">${fmt(p.unit_price??p.price??0)}</div>
        <div class="fav-card-actions" onclick="event.stopPropagation()">
          <button class="btn-fav-cart" onclick="addToCart(${p.id},'${esc(p.name)}',${p.unit_price??0},'${esc(p.category_name||'')}')">
            <i class="bi bi-cart-plus me-1"></i>Kosárba
          </button>
          <button class="btn-fav-remove" onclick="removeFav(${p.id},this)" title="Eltávolítás">
            <i class="bi bi-heart-fill"></i>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function addToCart(id,name,price,category){
  let cart=getCart();
  const idx=cart.findIndex(x=>String(x.id)===String(id));
  if(idx>=0){cart[idx].qty++;} else {cart.push({id,name,price,category,qty:1});}
  saveCart(cart);
  // Update badge
  const badge=document.getElementById('cartBadge');
  if(badge){
    const n=cart.reduce((s,it)=>s+(it.qty||1),0);
    badge.textContent=n; badge.style.display=n>0?'inline-block':'none';
  }
  toast(name+' kosárba helyezve ✓');
}

function removeFav(id,btn){
  const ws=getWishlist();
  ws.delete(String(id)); ws.delete(Number(id));
  saveWishlist(ws);
  // Update badge
  const badge=document.getElementById('favBadge');
  if(badge){badge.textContent=ws.size; badge.style.display=ws.size>0?'inline-block':'none';}
  const card=btn?.closest('.fav-card');
  if(card){card.style.transition='all 300ms';card.style.opacity='0';card.style.transform='scale(0.85)';setTimeout(()=>loadFavorites(),300);}
  toast('Eltávolítva a kedvencekből','info');
}

document.addEventListener('DOMContentLoaded', loadFavorites);
